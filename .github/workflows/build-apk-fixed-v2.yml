name: Build Calculator APK (API 37 package fix)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Calculator-PrivateTools-GitHub-Final-v2-5.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Missing $ZIP_FILE in repository root. Upload this ZIP to the repository root and commit it."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted-project
          PROJECT_DIR="extracted-project/Calculator-PrivateTools-Android"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37 platform (37.0 package name)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root environment variable was not set."
            exit 1
          fi
          echo "Android SDK root: $SDK_ROOT"
          # The published platform folder/package is android-37.0, not android-37.
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ]; then
            sdkmanager --install "platforms;android-37.0"
          fi
          sdkmanager --install "build-tools;36.0.0" "platform-tools"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ]; then
            echo "Android API 37.0 platform is not available after sdkmanager install."
            sdkmanager --list | grep -E 'platforms;android-37|build-tools;37' || true
            exit 1
          fi
          # Some AGP versions still look for the canonical android-37 folder.
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          ls -ld "$SDK_ROOT/platforms/android-37" "$SDK_ROOT/platforms/android-37.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-debug-APK
          path: extracted-project/Calculator-PrivateTools-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
